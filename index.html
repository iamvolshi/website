<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLSHi</title>
<meta name="description" content="No fantasy, no dream. Just reality — with receipts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: "class", theme: { extend: {
  colors: { "primary": "#e6c364", "ground-deep": "#060607", "paper-light": "#F5F2ED", "on-surface": "#e5e2e1", "on-surface-variant": "#d0c5b2" },
  fontFamily: { "headline": ["Newsreader", "serif"], "body": ["Inter", "sans-serif"], "telemetry": ["IBM Plex Mono", "monospace"] }
} } };
</script>
<style>
  html, body { height: 100%; background: #060607; }
  .landing-scrim { background: linear-gradient(to top, rgba(6,6,7,.92) 0%, rgba(6,6,7,.45) 34%, rgba(6,6,7,0) 58%); }
  @media (min-width: 768px) {
    .landing-scrim { background: linear-gradient(to right, rgba(6,6,7,.90) 0%, rgba(6,6,7,.55) 34%, rgba(6,6,7,0) 62%); }
  }
  .landing-enter { animation: cue-pulse 2.6s ease-in-out infinite; }
  @keyframes cue-pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  .landing-fade { animation: landing-in 900ms ease-out both; }
  @keyframes landing-in { from { opacity: 0; } to { opacity: 1; } }
  .landing-img { animation: face-slide 4s cubic-bezier(.22,.61,.36,1) both; will-change: transform; }
  @keyframes face-slide { from { transform: scale(1.7) translateX(16%); } to { transform: scale(1) translateX(0); } }
  .landing-headline { text-shadow: 0 2px 28px rgba(6,6,7,.55); }
  .landing-headline .w { display: inline-block; white-space: nowrap; }
  .landing-headline .ltr { display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(8px); transition: opacity .5s ease, filter .5s ease, transform .5s ease; }
  .landing-headline.in .ltr { opacity: 1; filter: blur(0); transform: none; }
  #sparkle-canvas { position: absolute; inset: 0; pointer-events: none; }
  a.landing-link:focus-visible { outline: 2px solid #e6c364; outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) {
    .landing-enter, .landing-fade, .landing-img { animation: none; }
  }
</style>
<link rel="icon" type="image/png" href="/assets/img/volshi-favicon.png">
</head>
<body class="bg-ground-deep">
<a href="/home/" class="landing-link landing-fade group relative block w-full overflow-hidden" style="height:100vh; height:100dvh;" aria-label="Enter the VOLSHi site">
  <img src="assets/img/hero-face.jpg" alt="" fetchpriority="high" class="landing-img absolute inset-0 h-full w-full object-cover" style="object-position:60% 30%;">
  <div class="landing-scrim absolute inset-0" aria-hidden="true"></div>
  <canvas id="sparkle-canvas" aria-hidden="true"></canvas>
  <div class="absolute inset-0 flex flex-col justify-between p-6 md:p-12">
    <div class="flex items-center justify-between">
      <img src="assets/img/volshilogowhite.png" alt="VOLSHi" class="h-10 md:h-12 w-auto object-contain">
      <span class="hidden sm:block font-telemetry text-[11px] tracking-[0.14em] uppercase text-on-surface-variant/80">Research Triangle Park · NC</span>
    </div>
    <div class="flex flex-1 items-center">
      <h1 class="landing-headline max-w-2xl font-headline text-[42px] leading-[1.04] md:text-[68px] text-paper-light">No fantasy, no dream. Just reality — with receipts.</h1>
    </div>
    <div>
      <p class="landing-enter flex items-center gap-3 font-telemetry text-[12px] tracking-[0.22em] uppercase text-primary">
        <span class="inline-block h-px w-10 bg-primary/80"></span>
        <span>Click to enter</span>
        <span aria-hidden="true">→</span>
      </p>
    </div>
  </div>
</a>
<script>
(function(){
  var LINES = [
    "No fantasy, no dream. Just reality — with receipts.",
    "The machine that can't forget their past actions.",
    "Nothing is erased. That's the point.",
    "I don't do fake.",
    "We are the singularity."
  ];
  var h = document.querySelector('.landing-headline');
  if(!h) return;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced) return; // first line stays static: no particles, no rotation
  var canvas = document.getElementById('sparkle-canvas');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, parts = [], bursts = [];
  var GOLD = ['#e6c364', '#c9a84c', '#f5e6b8'];
  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function newPart(x, y, burst){
    return { x: x != null ? x : W * (0.04 + Math.random() * 0.56),
      y: y != null ? y : H * (0.22 + Math.random() * 0.56),
      r: 0.8 + Math.random() * 1.7,
      c: GOLD[(Math.random() * GOLD.length) | 0],
      ph: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 0.9,
      vy: -(0.05 + Math.random() * 0.16),
      vx: (Math.random() - 0.5) * 0.08,
      life: burst ? 1 : Infinity, decay: burst ? 0.012 + Math.random() * 0.01 : 0 };
  }
  function seed(){
    parts = [];
    var n = W < 768 ? 26 : 55;
    for(var i = 0; i < n; i++) parts.push(newPart());
  }
  function burst(){
    var r = h.getBoundingClientRect();
    for(var i = 0; i < 26; i++){
      bursts.push(newPart(r.left + Math.random() * r.width, r.top + Math.random() * r.height, true));
    }
  }
  var t = 0;
  function frame(){
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    var i, p, a;
    for(i = 0; i < parts.length; i++){
      p = parts[i];
      p.y += p.vy; p.x += p.vx;
      if(p.y < H * 0.18) p.y = H * 0.78;
      a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * p.sp * 2 + p.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a * 0.25;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, 6.2832); ctx.fill();
    }
    for(i = bursts.length - 1; i >= 0; i--){
      p = bursts[i];
      p.life -= p.decay; p.y += p.vy * 2; p.x += p.vx * 2;
      if(p.life <= 0){ bursts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life) * 0.9;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 0.6, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  function split(text){
    h.textContent = '';
    var words = text.split(' ');
    var li = 0;
    words.forEach(function(word, wi){
      var w = document.createElement('span');
      w.className = 'w';
      for(var ci = 0; ci < word.length; ci++){
        var s = document.createElement('span');
        s.className = 'ltr';
        s.textContent = word[ci];
        s.style.transitionDelay = Math.min(li * 28, 1000) + 'ms';
        w.appendChild(s);
        li++;
      }
      h.appendChild(w);
      if(wi < words.length - 1) h.appendChild(document.createTextNode(' '));
    });
  }
  var idx = 0, swapping = false;
  function show(i){
    idx = i;
    split(LINES[idx]);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ h.classList.add('in'); }); });
  }
  function next(){
    if(swapping) return;
    swapping = true;
    var letters = h.querySelectorAll('.ltr');
    for(var k = 0; k < letters.length; k++) letters[k].style.transitionDelay = '0ms';
    h.classList.remove('in');
    setTimeout(function(){
      show((idx + 1) % LINES.length);
      burst();
      swapping = false;
    }, 500);
  }
  resize();
  window.addEventListener('resize', function(){ resize(); seed(); });
  seed();
  frame();
  show(0);
  setTimeout(function(){ h.classList.add('in'); }, 3000); // safety: never leave the headline invisible
  setInterval(next, 5000);
})();
</script>
</body>
</html>
