<script>

<style>

  .landing-scrim { background: linear-gradient(to top, rgba(6,6,7,.92) 0%, rgba(6,6,7,.45) 34%, rgba(6,6,7,0) 58%); }
  @media (min-width: 768px) {
    .landing-scrim { background: linear-gradient(to right, rgba(6,6,7,.90) 0%, rgba(6,6,7,.55) 34%, rgba(6,6,7,0) 62%); }

  a.landing-link:focus-visible { outline: 2px solid #e6c364; outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) {
