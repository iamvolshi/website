<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080809">
  <meta name="description" content="VOLSHi builds infrastructure for trustworthy autonomous intelligence.">
  <title>VOLSHi — Intelligence Infrastructure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <section class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-overlay" aria-hidden="true"></div>

    <header>
      <div class="header-logo">
        <a href="/" aria-label="VOLSHi home">
          <img src="assets/volshilogowhite.png" alt="VOLSHi">
        </a>
      </div>

      <nav id="main-nav" aria-label="Primary navigation">
        <a href="#">Technology</a>
        <a href="#">ARCHETRON</a>
        <a href="#">Research</a>
        <a href="#">Company</a>
        <a href="#">Contact</a>
      </nav>

      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-controls="main-nav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="hero-content">
      <div>
        <div class="eyebrow">VOLSHi&nbsp;/&nbsp;Intelligence Infrastructure</div>
        <h1>Intelligence<br>Requires<br><span class="gold">Trust.</span></h1>
        <p class="subline">We build the infrastructure that earns it.</p>
        <a href="#" class="cta">Explore ARCHETRON <span aria-hidden="true">→</span></a>
      </div>
    </main>

    <div class="system-line" aria-label="VOLSHi operating sequence">
      <span class="sys-step">Observe</span>
      <span class="sys-sep" aria-hidden="true"></span>
      <span class="sys-step">Understand</span>
      <span class="sys-sep" aria-hidden="true"></span>
      <span class="sys-step">Decide</span>
      <span class="sys-sep" aria-hidden="true"></span>
      <span class="sys-step">Act</span>
      <span class="sys-sep" aria-hidden="true"></span>
      <span class="sys-step">Account</span>
    </div>
  </section>

  <script src="src/site.js" defer></script>

</html>
